<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b3d28">
<script>try{var t=localStorage.getItem('absen_tema');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Admin Absensi</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<style>
:root{--bg:#0b3d28;--body-bg:radial-gradient(60vmax 45vmax at 92% -10%,rgba(90,220,140,.38),transparent 60%),radial-gradient(50vmax 40vmax at -12% 40%,rgba(200,241,53,.14),transparent 60%),linear-gradient(180deg,#0f5136,#0a3a26 55%,#072a1b);--panel:rgba(255,255,255,.07);--panel-2:rgba(255,255,255,.12);--line:rgba(255,255,255,.15);--ink:#f2fbef;--muted:#a6cbb4;--box:#0e402a;--overlay:rgba(2,28,16,.78);--camMsg:rgba(6,44,28,.86);--chipbg:rgba(6,44,28,.72);--stagebg:#04281a;--vignette:rgba(4,40,24,.55);--jam-end:#a8e6bd;--ph:#7fae92;--lime:#c8f135;--orange:#ff8a2a;--red:#ff5c5c;color-scheme:dark}
:root[data-theme="dark"]{--bg:#0c0e12;--body-bg:radial-gradient(60vmax 40vmax at 92% -10%,rgba(200,241,53,.13),transparent 60%),radial-gradient(50vmax 40vmax at -12% 35%,rgba(255,138,42,.12),transparent 60%),#0c0e12;--panel:rgba(255,255,255,.05);--panel-2:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--ink:#eef1ea;--muted:#8f968c;--box:#14171c;--overlay:rgba(3,4,6,.76);--camMsg:rgba(10,12,15,.86);--chipbg:rgba(10,12,15,.7);--stagebg:#000;--vignette:rgba(0,0,0,.55);--jam-end:#aab59d;--ph:#5d645b}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{min-height:100dvh;font-family:Manrope,system-ui,sans-serif;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);position:relative;overflow-x:hidden;background:var(--body-bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 15%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 15%,#000 15%,transparent 72%)}
body>*{position:relative;z-index:1}
button{font:800 .78rem Unbounded,sans-serif;letter-spacing:.01em;border:0;border-radius:999px;padding:14px 20px;cursor:pointer;min-height:50px;color:var(--ink);background:none;transition:transform .12s,box-shadow .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.3;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.b-main{background:var(--lime);color:#0b1405;box-shadow:0 14px 34px -14px var(--lime)}
.b-sun{background:var(--orange);color:#1d0d00;box-shadow:0 14px 34px -14px var(--orange)}
.b-glass,.b-line{background:var(--panel-2);border:1px solid var(--line);backdrop-filter:blur(10px)}
.tema{min-height:38px;padding:8px 16px;font-size:.62rem}
.tema::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:9px;vertical-align:-1px;background:linear-gradient(90deg,#16a05f 50%,#0c0e12 50%);border:1px solid var(--line)}
input,select{width:100%;font:500 1rem Manrope,sans-serif;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);min-height:52px}
input::placeholder{color:var(--ph)}
label{display:block;font:500 .68rem 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
.sheet{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(8px);display:grid;place-items:end center;padding:12px;z-index:20;overflow:auto}
.box{background:var(--box);border:1px solid var(--line);border-radius:30px;padding:24px;width:min(460px,100%);animation:up .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(30px) scale(.97);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{padding:calc(env(safe-area-inset-top) + 24px) clamp(16px,4vw,36px) 8px}
.wrap{max-width:1180px;margin:0 auto}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
h1{font:800 clamp(1.25rem,4vw,1.8rem) Unbounded;letter-spacing:-.03em}
h1::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--lime);margin-right:.55em;box-shadow:0 0 18px var(--lime)}
.sub{font:500 .7rem 'JetBrains Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
main{max-width:1180px;margin:0 auto;padding:10px clamp(14px,4vw,36px) 56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:20px;backdrop-filter:blur(16px)}
.login{max-width:400px;margin:36px auto 0;padding:0 16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input[type=date]{width:auto;font:500 .9rem 'JetBrains Mono',monospace;min-height:46px;padding:10px 14px}
.tools button{min-height:46px;padding:11px 18px;font-size:.68rem}
.tools .tema{min-height:46px;padding:11px 18px;font-size:.62rem}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:999px}
.tabs button{min-height:40px;padding:9px 18px;font-size:.68rem}
.tabs button.on{background:var(--lime);color:#0b1405}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0 6px}
.stat{padding:20px 18px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;height:3px;width:46%;background:var(--lime)}
.stat.late::before{background:var(--orange)}.stat.miss::before{background:var(--red)}
.stat b{display:block;font:800 2.5rem/1 Unbounded;letter-spacing:-.05em}
.stat span{display:block;margin-top:12px;font:500 .66rem 'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h2{font:800 .74rem Unbounded;letter-spacing:.1em;text-transform:uppercase;margin:34px 0 14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:14px}
.emp-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:14px}
.emp-h b{font:800 1rem Unbounded;letter-spacing:-.02em}
.emp-h span{font:500 .68rem 'JetBrains Mono';letter-spacing:.06em;color:var(--muted);text-align:right}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0}
.ph{position:relative;aspect-ratio:3/4;border-radius:20px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.2);display:grid;place-items:center;text-align:center;font-size:.74rem;color:var(--muted);padding:10px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph:has(img){border:1px solid var(--line)}
figcaption{font-size:.76rem;color:var(--muted);margin-top:9px;line-height:1.6}
figcaption b{color:var(--ink);font:800 .78rem Unbounded}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font:700 .64rem 'JetBrains Mono';letter-spacing:.05em;text-transform:uppercase;background:rgba(200,241,53,.14);color:var(--lime)}
.tag.late{background:rgba(255,138,42,.16);color:var(--orange)}.tag.bad{background:rgba(255,92,92,.16);color:var(--red)}
a{color:var(--lime);font-weight:700;text-underline-offset:3px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.86rem;font-weight:600}
.pill small{color:var(--muted);font:500 .68rem 'JetBrains Mono';margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:14px 8px;border-bottom:1px solid var(--line)}
th{font:500 .64rem 'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td .b-line{min-height:38px;padding:8px 16px;font-size:.64rem}
.sheet{place-items:center}
.err{color:var(--red);font-size:.86rem;margin-top:12px;min-height:1.2em}
.zoom img{max-width:min(92vw,720px);max-height:88dvh;border-radius:22px;border:1px solid var(--line)}
#prev{width:100%;max-height:220px;object-fit:cover;border-radius:18px;margin-top:10px}
@media(max-width:560px){th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body>
<section id="vLogin">
  <div class="top"><div class="wrap"><div><h1>Dashboard Admin</h1><div class="sub">Absensi Pasar Group Buah Abadi</div></div><button class="b-glass tema" aria-label="Ganti tema"></button></div></div>
  <div class="login"><div class="card">
    <label for="apin" style="margin-top:0">PIN admin</label>
    <input id="apin" type="password" autocomplete="current-password" placeholder="••••••">
    <button class="b-main" id="btnLogin" style="width:100%;margin-top:14px">Masuk</button>
    <div class="err" id="loginErr"></div>
  </div></div>
</section>

<section id="vApp" hidden>
  <div class="top"><div class="wrap">
    <div><h1>Dashboard Admin</h1><div class="sub" id="subLok">Absensi Pasar Group Buah Abadi</div></div>
    <div class="tabs"><button class="on" data-tab="hari">Kehadiran</button><button data-tab="kar">Karyawan</button></div>
    <div class="tools"><input type="date" id="tgl" aria-label="Tanggal"><button class="b-glass tema" aria-label="Ganti tema"></button><button class="b-glass" id="btnRef">Muat ulang</button><button class="b-glass" id="btnOut">Keluar</button></div>
  </div></div>
  <main>
    <div id="tHari">
      <div class="stats" id="stats"></div>
      <h2>Sudah absen</h2><div class="grid" id="hadir"></div>
      <h2>Belum absen</h2><div class="pills" id="belum"></div>
    </div>
    <div id="tKar" hidden>
      <div class="card">
        <div class="tools" style="justify-content:space-between;margin-bottom:8px"><b>Daftar karyawan</b><button class="b-main" id="btnTambah">Tambah karyawan</button></div>
        <table><thead><tr><th>ID</th><th>Nama</th><th>Jabatan</th><th>Wajah</th><th></th></tr></thead><tbody id="karBody"></tbody></table>
      </div>
    </div>
  </main>
</section>

<div class="sheet" id="mKar" hidden><div class="box">
  <h1 id="mTitle" style="font-size:1.25rem">Karyawan</h1>
  <label for="kId">ID</label><input id="kId" autocapitalize="characters" placeholder="K001">
  <label for="kNama">Nama lengkap</label><input id="kNama">
  <label for="kJab">Jabatan</label><input id="kJab">
  <label for="kPin">PIN <span id="pinNote"></span></label><input id="kPin" type="password" inputmode="numeric" maxlength="8">
  <label for="kSt">Status</label><select id="kSt"><option>Aktif</option><option>Nonakticonst API_URLf</option></select>
  <label for="kFoto">Foto wajah (jelas, menghadap depan, satu orang)</label>
  <input id="kFoto" type="file" accept="image/*"><img id="prev" alt="" hidden>
  <div class="err" id="kErr"></div>
  <div style="display:flex;gap:10px;margin-top:14px"><button class="b-line" id="kBatal" style="flex:1">Batal</button><button class="b-main" id="kSimpan" style="flex:1">Simpan</button></div>
</div></div>
<div class="sheet zoom" id="mZoom" hidden><img id="zImg" alt="Foto absen"></div>

<script>
/* GANTI dengan URL Web app Apps Script Anda (berakhiran /exec) */
const API_URL='https://script.google.com/macros/s/AKfycbwIvkSzJIOnZB-xtOKOu9V9uAdL-V_YPokZtGuXYjLsC7rTn9uEmq1BPyX7af6U_18GHw/exec';
const MODEL_URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const $=id=>document.getElementById(id);
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
let token=ss.get('adm_token'),karList=[],photoCache={},faceReady=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(action,p){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token},p||{}))}).then(x=>x.json());
  if(r.ok===false&&/Sesi admin/.test(r.pesan||'')){logout();}
  return r;
}
function show(app){$('vLogin').hidden=app;$('vApp').hidden=!app}
function logout(){token=null;ss.del('adm_token');show(false)}

$('btnLogin').onclick=async()=>{
  $('loginErr').textContent='';$('btnLogin').disabled=true;
  try{
    const r=await api('admin_login',{pin:$('apin').value});
    if(!r.ok){$('loginErr').textContent=r.pesan;return}
    token=r.token;ss.set('adm_token',token);$('apin').value='';start();
  }catch(e){$('loginErr').textContent='Tidak bisa terhubung ke server.'}
  finally{$('btnLogin').disabled=false}
};
$('apin').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnLogin').click()});
$('btnOut').onclick=logout;
$('btnRef').onclick=()=>{photoCache={};load()};
$('tgl').onchange=load;

function todayWib(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})}
function start(){show(true);$('tgl').value=todayWib();load();loadKar()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('tHari').hidden=b.dataset.tab!=='hari';$('tKar').hidden=b.dataset.tab!=='kar';
});

/* Kehadiran */
async function load(){
  $('hadir').innerHTML='<div class="card">Memuat…</div>';
  const r=await api('admin_rekap',{tanggal:$('tgl').value});
  if(!r.ok){$('hadir').innerHTML='<div class="card">'+esc(r.pesan)+'</div>';return}
  const d=r.data,s=d.ringkas;
  $('subLok').textContent=d.lokasi+', radius '+d.radius+' m';
  $('stats').innerHTML=[['Karyawan aktif',s.aktif,''],['Sudah hadir',s.hadir,''],['Terlambat',s.terlambat,'late'],['Belum absen',s.belum,'miss'],['Sudah pulang',s.pulang,'']]
    .map(x=>'<div class="card stat '+x[2]+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
  $('hadir').innerHTML=d.hadir.length?d.hadir.map(h=>
    '<div class="card"><div class="emp-h"><b>'+esc(h.nama)+'</b><span>'+esc(h.id)+' · '+esc(h.jabatan)+'</span></div><div class="shots">'+shot('Masuk',h.masuk,d.radius)+shot('Pulang',h.pulang,d.radius)+'</div></div>').join(''):'<div class="card">Belum ada yang absen pada tanggal ini.</div>';
  $('belum').innerHTML=d.belum.length?d.belum.map(k=>'<span class="pill">'+esc(k.nama)+' <small>'+esc(k.id)+'</small></span>').join(''):'<span class="sub" style="color:var(--muted)">Semua karyawan aktif sudah absen.</span>';
  lazy();
}
function shot(tipe,x,radius){
  if(!x)return '<figure><div class="ph">Belum absen '+tipe.toLowerCase()+'</div></figure>';
  const out=x.jarak>radius,cls=x.status==='Terlambat'?'late':'';
  return '<figure><div class="ph">'+(x.foto?'<span data-url="'+esc(x.foto)+'">Memuat foto…</span>':'Tanpa foto')+'</div><figcaption><b>'+tipe+' '+esc(String(x.jam).slice(0,5))+'</b> <span class="tag '+cls+'">'+esc(x.status)+'</span><br>Jarak '+esc(x.jarak)+' m dari lokasi'+(out?' <span class="tag bad">di luar radius</span>':'')+
    '<br>Kecocokan wajah: '+(x.wajah===''||x.wajah==null?'tidak dicek':esc(x.wajah)+' (makin kecil makin mirip)')+
    '<br><a href="https://www.google.com/maps?q='+esc(x.lat)+','+esc(x.lng)+'" target="_blank" rel="noopener">Lihat di peta</a></figcaption></figure>';
}
const io=new IntersectionObserver(es=>es.forEach(async e=>{
  if(!e.isIntersecting)return;io.unobserve(e.target);
  const el=e.target,u=el.dataset.url;
  try{
    if(!photoCache[u]){const r=await api('admin_foto',{url:u});if(!r.ok)throw new Error(r.pesan);photoCache[u]=r.data}
    el.outerHTML='<img src="'+photoCache[u]+'" alt="Foto absen" data-z="1">';
  }catch(x){el.textContent='Foto gagal dimuat'}
}),{rootMargin:'200px'});
function lazy(){document.querySelectorAll('[data-url]').forEach(el=>io.observe(el))}
document.addEventListener('click',e=>{if(e.target.dataset&&e.target.dataset.z){$('zImg').src=e.target.src;$('mZoom').hidden=false}});
$('mZoom').onclick=()=>{$('mZoom').hidden=true};

/* Karyawan */
async function loadKar(){
  const r=await api('admin_karyawan');if(!r.ok)return;
  karList=r.data;
  $('karBody').innerHTML=karList.map((k,i)=>'<tr><td>'+esc(k.id)+'</td><td>'+esc(k.nama)+(k.status!=='Aktif'?' <span class="tag bad">nonaktif</span>':'')+'</td><td>'+esc(k.jabatan)+'</td><td><span class="tag '+(k.wajah?'':'bad')+'">'+(k.wajah?'Terdaftar':'Belum')+'</span></td><td><button class="b-line" data-edit="'+i+'">Ubah</button></td></tr>').join('')||'<tr><td colspan="5">Belum ada karyawan.</td></tr>';
}
$('karBody').onclick=e=>{const i=e.target.dataset.edit;if(i!==undefined)openKar(karList[i])};
$('btnTambah').onclick=()=>openKar(null);
function openKar(k){
  $('mTitle').textContent=k?'Ubah karyawan':'Tambah karyawan';
  $('kId').value=k?k.id:'';$('kId').readOnly=!!k;$('kNama').value=k?k.nama:'';$('kJab').value=k?k.jabatan:'';
  $('kPin').value='';$('pinNote').textContent=k?'(kosongkan bila tidak diubah)':'';$('kSt').value=k?k.status:'Aktif';
  $('kFoto').value='';$('prev').hidden=true;$('kErr').textContent='';$('mKar').hidden=false;
  if(faceReady===null)faceReady=Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)]).catch(()=>{faceReady=null;return 'gagal'});
}
$('kBatal').onclick=()=>{$('mKar').hidden=true};
$('kFoto').onchange=e=>{const f=e.target.files[0];if(f){$('prev').src=URL.createObjectURL(f);$('prev').hidden=false}};
const loadImg=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(f)});
$('kSimpan').onclick=async()=>{
  const err=$('kErr');err.textContent='';$('kSimpan').disabled=true;
  try{
    const id=$('kId').value.trim().toUpperCase();
    let r=await api('admin_simpan',{data:{id,nama:$('kNama').value.trim(),jabatan:$('kJab').value.trim(),pin:$('kPin').value,status:$('kSt').value}});
    if(!r.ok)throw new Error(r.pesan);
    const f=$('kFoto').files[0];
    if(f){
      if(await faceReady==='gagal'||!window.faceapi)throw new Error('Pemeriksa wajah gagal dimuat. Muat ulang halaman.');
      const im=await loadImg(f);
      const all=await faceapi.detectAllFaces(im,new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:0.5}));
      if(all.length!==1)throw new Error(all.length?'Terdeteksi lebih dari satu wajah. Gunakan foto satu orang.':'Wajah tidak terdeteksi. Gunakan foto yang lebih jelas.');
      const det=await faceapi.detectSingleFace(im,new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:0.5})).withFaceLandmarks(true).withFaceDescriptor();
      const w=Math.min(720,im.naturalWidth),h=Math.round(w*im.naturalHeight/im.naturalWidth),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
      r=await api('admin_wajah',{data:{id,desc:Array.from(det.descriptor),foto:c.toDataURL('image/jpeg',0.8).split(',')[1]}});
      if(!r.ok)throw new Error(r.pesan);
    }
    $('mKar').hidden=true;loadKar();
  }catch(e){err.textContent=e.message||'Gagal menyimpan.'}
  finally{$('kSimpan').disabled=false}
};

if(token)start();

/* Tema: hijau atau gelap */
function setTema(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('absen_tema',t)}catch(e){}
  document.querySelectorAll('.tema').forEach(b=>b.textContent=t==='dark'?'Tema: Gelap':'Tema: Hijau');
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#0c0e12':'#0b3d28');
}
document.querySelectorAll('.tema').forEach(b=>b.onclick=()=>setTema(document.documentElement.getAttribute('data-theme')==='dark'?'green':'dark'));
setTema(document.documentElement.getAttribute('data-theme')==='dark'?'dark':'green');
